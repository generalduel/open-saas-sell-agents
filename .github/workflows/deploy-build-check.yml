name: Deploy images build check

# Builds the production Docker targets (server + web) exactly as the VPS will,
# without pushing anywhere. Catches Wasp/Prisma/Vite build failures before deploy.
on:
  push:
    branches: [deploy/hostinger-prep]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.target }}
        run: |
          set +e
          docker buildx build . -f deploy/Dockerfile --target ${{ matrix.target }} \
            --build-arg REACT_APP_API_URL=https://api.my2ndworkforce.com \
            --progress=plain --load -t m2w-${{ matrix.target }}:ci > build.log 2>&1
          rc=$?
          tail -150 build.log
          if [ $rc -ne 0 ]; then
            echo "::error title=BUILD_TAIL::$(grep -v '^\s*$' build.log | sed 's/\x1b\[[0-9;]*m//g' | tail -45 | tr '\n' '|' | cut -c1-6000)"
          fi
          exit $rc
      - name: Smoke test web image
        if: matrix.target == 'web'
        run: docker run --rm --entrypoint sh m2w-web:ci -c 'test -f /srv/index.html && test -f /srv/200.html && ls /srv'

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Boot db + server with dummy secrets
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/=GENERATED$/=ci-generated-value-1234567890/; s/=FILL_ME$/=ci-dummy/' .env
          sed -i "s|^PORTAL_ENCRYPTION_KEY=.*|PORTAL_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          printf 'services:\n  server:\n    ports: ["3001:3001"]\n' > docker-compose.ci.yml
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build db server
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3001/ && break; sleep 5; done
          S=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/)
          T=$(docker compose exec -T db psql -U opensaas_app -d opensaas -tAc "select count(*) from information_schema.tables where table_schema='public'")
          M=$(docker compose exec -T db psql -U opensaas_app -d opensaas -tAc "select migration_name from _prisma_migrations")
          LOG=$(docker compose logs --tail=40 server | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | cut -c1-5000)
          echo "::notice title=SMOKE::http=$S tables=$T migrations=$M"
          echo "::notice title=SERVER_LOG::$LOG"
          test "$S" != "000"
