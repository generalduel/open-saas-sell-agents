name: Generate initial Prisma migration

# Run once (Actions tab -> Run workflow) on the deploy branch.
# Spins up a throwaway Postgres, runs `wasp db migrate-dev`, and commits
# template/app/migrations back to the branch so production can run
# `prisma migrate deploy`.
on:
  push:
    branches: [deploy/hostinger-prep]
    paths:
      - template/app/schema.prisma
      - .github/workflows/generate-prisma-migration.yml
  workflow_dispatch:
    inputs:
      name:
        description: Migration name
        default: init
        required: true

permissions:
  contents: write

env:
  WASP_TELEMETRY_DISABLE: 1

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: opensaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - run: npm i -g npm@11 @wasp.sh/wasp-cli@0.26.1
      - name: Generate migration
        working-directory: template/app
        run: |
          cp .env.server.example .env.server
          cp .env.client.example .env.client
          echo "DATABASE_URL=postgresql://postgres:ci@localhost:5432/opensaas" >> .env.server
          wasp install
          wasp db migrate-dev --name "${{ inputs.name || 'init' }}"
          ls -R migrations
      - name: Commit migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template/app/migrations
          git diff --cached --quiet || git commit -m "Add Prisma migration: ${{ inputs.name || 'init' }}"
          git push
